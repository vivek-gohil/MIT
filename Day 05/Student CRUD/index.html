<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="app.js"></script>
    <script src="services/studentService.js"></script>
    <script src="controllers/studentController.js"></script>
    <title>Student Form</title>
</head>

<body ng-app="StudentApp">
    <div ng-controller="StudentController">
       <h2>Student CRUD</h2>
       <h2>New Student Registration</h2>
       <hr>
       <form>
            Name : <input type="text" ng-model="student.name">
            <br><br>
            Email : <input type="email" ng-model="student.email">
            <br><br>
            Age : <input type="number" ng-model="student.age">
            <br><br>
            Course : 
            <select ng-model="student.course">
                <option value="">Select Course</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>
                <option value="Angular JS">Angular JS</option>
            </select>
            <button ng-click="addNewStudent()">Save</button>
       </form>
       <h2>All Students</h2>
       <table border="1">
            <tr>
                <td>Student Id</td>
                <td>Name</td>
                <td>Email</td>
                <td>Age</td>
                <td>Course</td>
                <td>Action</td>
            </tr>
            <tr ng-repeat="student in students">
                <td>{{student.studentId}}</td>
                <td>{{student.name}}</td>
                <td>{{student.email}}</td>
                <td>{{student.age}}</td>
                <td>{{student.course}}</td>
                <td>
                    <button ng-click="deleteStudent(student.id)">Delete</button> 
                </td>
            </tr>
       </table>
    </div>
</body>

</html>
