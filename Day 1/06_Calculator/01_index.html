
<!DOCTYPE html>
<html>

<head>

    <title>AngularJS Calculator</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js">
    </script>

</head>

<body ng-app>

    <h2>AngularJS Calculator</h2>

    <hr>

    Number 1:

    <input type="number" ng-model="num1">

    <br><br>

    Number 2:

    <input type="number" ng-model="num2">

    <hr>

    <h3>Addition: {{num1 + num2}}</h3>

    <h3>Subtraction: {{num1 - num2}}</h3>

    <h3>Multiplication: {{num1 * num2}}</h3>

    <h3>Division: {{num1 / num2}}</h3>

</body>

</html>
