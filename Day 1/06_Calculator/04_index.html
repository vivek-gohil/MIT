<!DOCTYPE html>
<html>

<head>
    <title>AngularJS Calculator</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js">
    </script>
</head>
<body ng-app>
    <h2>AngularJS Calculator</h2>
    <hr>
    Number 1:
    <input type="number" ng-model="num1">
    <br><br>
    Number 2:
    <input type="number" ng-model="num2">
    <br><br>

    <label>Select Operation:</label>

    <select ng-model="operation">
        <option value="add">Addition</option>
        <option value="sub">Subtraction</option>
        <option value="mul">Multiplication</option>
        <option value="div">Division</option>
    </select>

    <hr>

    <h3>Entered Numbers</h3>
    <p>Number 1: {{num1}}</p>
    <p>Number 2: {{num2}}</p>
    <hr>

    <h3>Result</h3>

    <div ng-if="num1 != null && num2 != null">

        <div ng-if="operation == 'add'">
            Addition: {{num1 + num2}}
        </div>

        <div ng-if="operation == 'sub'">
            Subtraction: {{num1 - num2}}
        </div>

        <div ng-if="operation == 'mul'">
            Multiplication: {{num1 * num2}}
        </div>

        <div ng-if="operation == 'div'">
            <span ng-if="num2 != 0">
                Division: {{num1 / num2}}
            </span>
            <span ng-if="num2 == 0">
                Cannot divide by zero.
            </span>
        </div>
        <br>
    </div>

    <button type="button" ng-click="num1 = null; num2 = null">
        Clear
    </button>
</body>
</html>
